<!doctype html>

<meta charset="utf-8">
<!-- /app/: la puerta de los anuncios (Instagram, 2026-11-12). Meta no deja que una
     promoción desde Instagram apunte a apps.apple.com (eso sólo lo admite el objetivo
     de instalaciones de Ads Manager), así que el anuncio apunta AQUÍ. Desde la noche
     del 12-nov (Gonzalo: «mejor sí apuntarlo a nuestra landing page») esta puerta manda
     a LA LANDING, en el idioma del navegador: inglés para todos salvo quien navega en
     español. Antes mandaba a la App Store en iPhone; esa versión vive en el historial
     del repo por si se quiere volver al salto directo. El salto va en JS y no en
     <meta http-equiv="refresh"> a propósito: el rastreador de Meta ve un sitio web. -->
<script>
(function(){
  var idioma=(navigator.language||navigator.userLanguage||"en").toLowerCase();
  location.replace(idioma.indexOf("es")===0 ? "../" : "../en/");
})();
</script>
